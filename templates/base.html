{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Harbe Digital Solutions{% endblock %}</title>

    <meta
        name="description"
        content="{% block description %}Harbe Digital Solutions builds modern software solutions for businesses.{% endblock %}"
    >

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    {% include "includes/navbar.html" %}

    <main>
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    {% include "includes/footer.html" %}

    <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
